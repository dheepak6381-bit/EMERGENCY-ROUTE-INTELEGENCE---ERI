<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/eri-ambulance/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="eri">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>eri</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="background-color: #06090e; margin: 0; overflow: hidden;">
  <style>
    body {
      background-color: #06090e;
      margin: 0;
      overflow: hidden;
    }
    .loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #06090e;
      z-index: 9999;
    }
    .logo {
      width: 120px;
      height: 120px;
      animation: pulse 2s infinite ease-in-out;
      filter: drop-shadow(0 0 20px rgba(0, 255, 255, 0.5));
    }
    .text {
      margin-top: 30px;
      color: #00ffff;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 1.2rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      animation: fade 1.5s infinite alternate;
    }
    @keyframes pulse {
      0% { transform: scale(0.9); }
      50% { transform: scale(1.1); filter: drop-shadow(0 0 40px rgba(0, 255, 255, 0.9)); }
      100% { transform: scale(0.9); }
    }
    @keyframes fade {
      0% { opacity: 0.4; }
      100% { opacity: 1; }
    }
  </style>
  <div class="loading-container" id="loader">
    <!-- Flutter web copies assets to assets/assets/... -->
    <img src="assets/assets/images/eri_logo.png" alt="ERI Logo" class="logo" onerror="this.src='favicon.png'" />
    <div class="text">Establishing Uplink...</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
